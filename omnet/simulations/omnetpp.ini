[General]
network = canlab.CanLabNetwork
sim-time-limit = 3s
seed-set = 1
cmdenv-express-mode = true
cmdenv-event-banners = false
**.scalar-recording = false
**.vector-recording = false
**.bitDuration = 2us
**.bus.experimentSeed = 1
**.bus.traceFile = "events.jsonl"

[Config Baseline]
description = "Normal synthetic traffic with passive observation"

[Config ConcurrentTraffic]
extends = Baseline
description = "Simultaneous synthetic ECU traffic and arbitration"

[Config MissingInputControl]
extends = Baseline
description = "Chassis releases one set of inputs, then its command becomes stale"
**.chassis.maxReleases = 1

[Config PassiveErrorFixture]
extends = Baseline
description = "Normal traffic; controller-state rule fixtures are exercised by the core unit checks"

[Config ArbitrationOrderSwap]
extends = Baseline
description = "Change simultaneous application release order"
**.chassis.releasePriority = -1
**.powertrain.releasePriority = 1

[Config QueuePressure]
extends = Baseline
description = "Exercise bounded queue admission under simultaneous releases"
**.bus.maxQueueDepth = 2

[Config NoAck]
extends = Baseline
description = "Check controller behavior when no receiver acknowledges"
sim-time-limit = 1ms
**.bus.ackEnabled = false

[Config NoAckPassiveLimit]
extends = NoAck
description = "Verify explicit failure when passive-only error handling would be required"
sim-time-limit = 10ms
